spring.application.name=estoque-roupas

# --- Banco de dados (MySQL do XAMPP) ---
# O banco "estoque_roupas" e criado automaticamente se nao existir.
spring.datasource.url=jdbc:mysql://localhost:3306/estoque_roupas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
# Senha FORA do codigo: vem da variavel de ambiente DB_PASSWORD (padrao do XAMPP = vazia)
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Thymeleaf ---
spring.thymeleaf.cache=false
